[project]
name = "music-tui"
version = "0.4.2"
description = "A terminal music player for QQ Music and NetEase Cloud Music"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
  "cryptography>=50,<51",
  "qrcode[pil]>=8,<9",
  "httpx>=0.28,<0.29",
  "qqmusic-api-python==0.7.3",
  "textual>=6,<7",
  "terminal-qrcode>=1.1,<2",
]

[project.urls]
Homepage = "https://github.com/FlyTOmeLight/music-tui"
Issues = "https://github.com/FlyTOmeLight/music-tui/issues"
Changelog = "https://github.com/FlyTOmeLight/music-tui/blob/main/CHANGELOG.md"

[project.scripts]
music-tui = "music_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=26,<27", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The integration test polls state received from a real mpv process with a deadline.
"tests/test_player.py" = ["ASYNC110", "ASYNC240"]
