name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish release distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/music-tui/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - name: Download GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern 'music_tui-*.whl' --pattern 'music_tui-*.tar.gz'
      - name: Publish to PyPI with Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
